#
# Board-specific configuration for the Raspberry Pi Pico 2 W
# (board target: rpi_pico2/rp2350a/m33_0/w).
#
# The onboard LED is driven through the CYW43 WiFi chip (WL_GPIO0) and is
# exposed via the standard `led0` devicetree alias -- no extra Kconfig is
# needed for the LED itself. WiFi (CYW4343W) needs `west blobs fetch
# hal_infineon` and is only used by the optional `wifi` snippet -- the
# MNIST demo does not require it.

# ---- USB CDC ACM console ---------------------------------------------------
# Mirrors projects/tflite-micro's board conf: the native USB port
# enumerates as /dev/ttyACM* and printk streams there (`make monitor`).
# The app never calls usb_enable(), so bring the stack up at boot.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
# Raspberry Pi VID/PID.
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x000A
CONFIG_USB_DEVICE_PRODUCT="Pico2W ExecuTorch MNIST"

# Console plumbing over the CDC ACM UART instance.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Handle SET_LINE_CDC/LINE_CTRL so host terminals (picocom etc.) work
# seamlessly with the CDC port.
CONFIG_UART_LINE_CTRL=y
#
# ---- FPU ------------------------------------------------------------------
# Arm-specific FPU settings (kept out of prj.conf: the symbols do not exist
# on x86, and assigning them there aborts the Kconfig step). The hard-float
# ABI is what the upstream samples use so CMSIS-NN builds behave the same.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y
