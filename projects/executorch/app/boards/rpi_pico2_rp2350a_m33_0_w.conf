#
# Board-specific configuration for the Raspberry Pi Pico 2 W
# (board target: rpi_pico2/rp2350a/m33_0/w).
#
# The FPU settings are already in prj.conf; this file documents what is
# Pico-2-W specific:
#
#  - The onboard LED is driven through the CYW43 WiFi chip (WL_GPIO0) and is
#    exposed via the standard `led0` devicetree alias -- no extra Kconfig is
#    needed for the LED itself.
#  - The default console is UART0 on header pins GP0 (TX) / GP1 (RX) at
#    115200 8N1.
#  - WiFi (CYW4343W) needs `west blobs fetch hal_infineon` and is only used
#    by the optional `wifi` snippet -- the MNIST demo does not require it.
#    See scripts/01_setup_workspace.sh, which fetches the blobs for you.
#
# Nothing is strictly required here today; keeping the file so that
# board-specific tuning has an obvious home (e.g. console on USB CDC).
