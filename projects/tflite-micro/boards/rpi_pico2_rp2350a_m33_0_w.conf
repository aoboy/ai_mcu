# USB CDC ACM console — board-specific (auto-applied by Zephyr for
# rpi_pico2/rp2350a/m33_0/w only; qemu_x86 keeps its regular console).
# Options mirror zephyr/samples/basic/pico2w_gpio16_blinky/prj.conf.
#
# The Pico 2 W enumerates as /dev/ttyACM* on the host and printk streams
# there; watch it with `make mcu_monitor`.

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
# Bring the USB device up at boot — the app never calls usb_enable().
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
# Raspberry Pi VID/PID.
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x000A
CONFIG_USB_DEVICE_PRODUCT="Pico2W TFLM Sine"

# Console plumbing over the CDC ACM UART instance.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Handle SET_LINE_CDC/LINE_CTRL so host terminals (minicom etc.) work
# seamlessly with the CDC port.
CONFIG_UART_LINE_CTRL=y
