# C++ application (tflite-micro is a C++ library)
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# TensorFlow Lite for Microcontrollers (west project 'tflite-micro',
# glue provided in-tree by zephyr/modules/tflite-micro)
CONFIG_TENSORFLOW_LITE_MICRO=y

# Head-room for setup + the C++ call chain (the tensor arena is static,
# so this only covers call frames).
CONFIG_MAIN_STACK_SIZE=4096

# printk("%f") support — used to print x_value/y_value.
CONFIG_REQUIRES_FLOAT_PRINTF=y
