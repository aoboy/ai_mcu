#
# prj.conf -- ExecuTorch MNIST demo on Raspberry Pi Pico 2 W
# Mirrors the official zephyr/samples/hello-executorch/prj.conf of the
# ExecuTorch repo, adjusted for the RP2350 (Cortex-M33, 520 KiB SRAM).

# ---- ExecuTorch -----------------------------------------------------------
# Enables the ExecuTorch Zephyr module (selects REQUIRES_FULL_LIBCPP itself).
CONFIG_EXECUTORCH=y

# ---- C++ ------------------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# ---- Memory ---------------------------------------------------------------
# The ExecuTorch runtime allocates some flatbuffer/method structures on the
# heap and needs deeper stacks than a hello-world.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=32768

# ---- Logging / console ----------------------------------------------------
CONFIG_LOG=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# ---- Operators ------------------------------------------------------------
# Keep the default "all portable ops" registry DISABLED and use the selective
# operator build in app/CMakeLists.txt: only the operators the embedded .pte
# actually needs are linked in, which keeps the binary small. Set this to y
# for a quick bring-up with an exotic model, at the cost of flash space.
CONFIG_EXECUTORCH_BUILD_PORTABLE_OPS=n

# ---- FPU ------------------------------------------------------------------
# The FPU settings are Arm-specific (Cortex-M33 FPv5-SP); they live in
# boards/rpi_pico2_rp2350a_m33_0_w.conf so the qemu_x86 smoke build (no FPU
# Kconfig) configures cleanly.

# ---- ExecuTorch memory pools ----------------------------------------------
# Size of the static pool that backs method metadata, the memory-planned
# activation buffers and the I/O tensors (see app/src/main.cpp). The official
# Pico 2 MNIST example reports ~46 KiB used for a tiny MLP; 128 KiB gives a
# comfortable margin for this small CNN. Raise it if load_method() reports
# MemoryAllocationFailed; lower it once you have measured your model.
CONFIG_EXECUTORCH_METHOD_ALLOCATOR_POOL_SIZE=131072

# Small per-op scratch pool, reset after every kernel invocation.
CONFIG_EXECUTORCH_TEMP_ALLOCATOR_POOL_SIZE=4096

# ---- GPIO (LED) -----------------------------------------------------------
CONFIG_GPIO=y
